<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101e" />
      <stop offset="50%" stop-color="#070a11" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin for maskable icon -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="90" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer Neon Ring Wave -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#glowGrad)" stroke-width="8" stroke-dasharray="14 10" opacity="0.6" />

  <!-- Center Glowing Hexagon / Play Shield -->
  <circle cx="256" cy="256" r="120" fill="#0f172a" stroke="url(#glowGrad)" stroke-width="6" filter="url(#glow)" />

  <!-- Play Triangle -->
  <path d="M 230 195 L 320 256 L 230 317 Z" fill="url(#playGrad)" />

  <!-- Audio Wave Bars on Side -->
  <rect x="135" y="236" width="10" height="40" rx="5" fill="#06b6d4" />
  <rect x="115" y="220" width="10" height="72" rx="5" fill="#3b82f6" />
  <rect x="367" y="220" width="10" height="72" rx="5" fill="#10b981" />
  <rect x="387" y="236" width="10" height="40" rx="5" fill="#06b6d4" />

  <!-- AI Sparkle -->
  <path d="M 330 150 Q 330 180 360 180 Q 330 180 330 210 Q 330 180 300 180 Q 330 180 330 150 Z" fill="#22d3ee" />
</svg>
